# Smoke gate (prereg §9 + amend1 r_goal(N) + amend2 process noise). single-gate x N=100 x real.
run_name: smoke_singlegate_N100_real
N: 100
condition: real
seeds: [0, 1, 2]                 # main run (W on, CBF on, NU=0)
density_sweep_N: [25, 50, 100, 150, 200]

grid_step: 0.2
dt_exec: 0.01

scenario:
  w_goal: 2.0                    # conical goal-progress weight
  w_hold: 8.0                    # running penalty for being outside r_goal (goal-holding term)
  goal_softness: 0.25
  obs_penalty: 200.0             # soft macro wall
  wall_thickness: 0.3
  edge_softness: 0.25

macro_cost:
  c_w: 1.0                       # W(m) = c_w m^2  (c_w=0 -> "W off", §9 (1))
  w_bar: 10.0                    # soft collision barrier
  m_bar: 6.25                    # = 1/R_BARRIER^2, agents/m^2
  f_cap: 300.0                   # solver safeguard (inactive at m*: reported)

fp:
  damping: 0.02
  max_iters: 800
  burn_in: 200
  tol: 0.005

control:
  c_dens: 1.0                    # C_DENS, prereg §3

cbf:
  d_safe: 0.40                   # D_COLLISION 0.30 + 0.10 m margin
  r_wall: 0.20                   # wall half-thickness 0.05 + R_D 0.15
  r_body: 0.15
  gamma: 20.0
  rho: 1.0
  slack_lin: 100.0
  k_nb: 8
  r_sense: 5.0
  prio_gain: 2.0
  prio_min: 0.25
  u_box: 5.656854249492381       # V_MAX / sqrt(2)
  tol: 1.0e-5
  maxiter: 2000
  qp_solver: exact               # exact 2-D enumeration; "boxosqp" kept as reference (did not converge in attempt 1)

variants:                        # label -> overrides; 'main' is gated, the rest are facts
  main:        {cbf_on: true,  nu: 0.0,   c_w: 1.0}
  w_off:       {cbf_on: true,  nu: 0.0,   c_w: 0.0, seeds: [0]}
  cbf_off:     {cbf_on: false, nu: 0.0,   c_w: 1.0, seeds: [0]}
  noise_nu091: {cbf_on: true,  nu: 0.091, c_w: 1.0, seeds: [0]}
